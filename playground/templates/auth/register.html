{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - MaAnoUlam?</title>

    <!-- Fonts & Icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Quicksand:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Base Styles -->
    <link rel="stylesheet" href="{% static 'style.css' %}" />

    <style>
      /* 1. Simulated Homepage Background */
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        overflow: hidden;
        background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBq-IvAjagli-bZR_WtjRP9whc8os2_OMRpHZBeTnfnJ4ic6pgBNxoAEsPBm6M-d-e8FAFFQuJmff8Z5_Vp0RentAxJl4lr1YM8yOMaTwVScwx7Wfw0Mrp0zir9QfupXvoIcoTi-DVL38NBdV72Ui2-qvpu0Lkz1TKBQxPX5w6QWT3GwM316qY2aPJIgpbTMbqS2mza1wRIdANUrU3DtKkE_15fvoC0AKO7RV1Z--VtnXJ8Bb04CcQUiw");
        background-size: cover;
        background-position: center;
      }

      /* 2. Frosted Glass Blur Overlay */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(25, 28, 30, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 1000;
      }

      /* 3. The Login Panel */
      .auth-panel {
        position: relative;
        background: white;
        width: 100%;
        max-width: 400px;
        padding: 40px 32px;
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        animation: slideUp 0.3s ease-out forwards;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .close-btn {
        position: absolute;
        top: 16px;
        right: 16px;
        background: var(--surface-light);
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--text-muted);
        cursor: pointer;
        text-decoration: none;
        transition: 0.2s ease;
      }

      .close-btn:hover {
        background: var(--surface-high);
        color: #ba1a1a;
      }

      .auth-header {
        text-align: center;
        margin-bottom: 32px;
      }

      .auth-header h1 {
        font-family: var(--font-heading);
        color: var(--primary);
        font-size: 28px;
        margin: 0 0 8px;
      }

      .auth-header p {
        color: var(--text-muted);
        font-size: 14px;
        margin: 0;
      }

      /* 4. Form Styling */
      .auth-form p {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 20px;
      }

      .auth-form label {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
      }

      .auth-form input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        font-family: inherit;
        font-size: 16px;
        box-sizing: border-box;
        transition: border-color 0.2s ease;
      }

      .auth-form input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.2);
      }

      .auth-form .helptext,
      .auth-form ul.errorlist {
        font-size: 12px;
        color: #ba1a1a;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .auth-footer {
        margin-top: 24px;
        text-align: center;
        font-size: 14px;
        color: var(--text-muted);
      }

      .auth-footer a {
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
      }

      .auth-footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="modal-overlay">
      <div class="auth-panel">
        <!-- Simulated 'Close' button that returns to the previous page -->
        <a href="javascript:history.back()" class="close-btn">
          <span class="material-symbols-outlined" style="font-size: 20px"
            >close</span
          >
        </a>

        <div class="auth-header">
          <h1>Create an account</h1>
          <p>Register to access your pantry and saved recipes.</p>
        </div>

        <form method="POST" class="auth-form">
          {% csrf_token %}

          <!-- Django's built-in form rendering, styled by our CSS -->
          {{ form.as_p }}

          <button
            type="submit"
            class="primary-button"
            style="
              width: 100%;
              padding: 14px;
              margin-top: 8px;
              font-size: 16px;
              border-radius: 12px;
            "
          >
            Log In
          </button>
        </form>

        <div class="auth-footer">
          Don't have an account? <a href="{% url 'register' %}">Sign up here</a>
        </div>
      </div>
    </div>
  </body>
</html>
